name: Daily blog auto-publish

on:
  schedule:
    - cron: "47 9 * * *"  # 09:47 UTC = 2:47 PM Pakistan. Off-peak minute to dodge GitHub cron congestion.
  workflow_dispatch: {}    # lets you publish the next one manually too

permissions:
  contents: write          # commit the newly published post + updated queue
  issues: write            # the queue-empty/failure alert opens a GitHub issue —
                           # declaring any permission zeroes the rest, so without
                           # this line the Sept-1 alert dies with a 403

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Job-level so BOTH validate-queue (runway warnings) and publish-next see
      # the same rate. Slowed from 2/day on 2026-08-24 (owner's call).
      PUBLISH_COUNT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Gate: a malformed queued post would otherwise be injected into
      # posts-batch-3.ts, break the Vercel build, and stop the site updating
      # while this job still reported success.
      - name: Validate the queue before publishing
        run: node tools/blog-queue/validate-queue.mjs

      - name: Publish next queued post
        run: node tools/blog-queue/publish-next.mjs

      - name: Ping IndexNow (Bing / Yandex / Naver / Seznam)
        run: |
          F=tools/blog-queue/published-urls.json
          if [ -s "$F" ] && [ "$(cat "$F")" != "[]" ]; then
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"host\":\"helpinstudy.com\",\"key\":\"a7c4e1f92b8d6035c4a9e2f71d8b0463\",\"keyLocation\":\"https://helpinstudy.com/a7c4e1f92b8d6035c4a9e2f71d8b0463.txt\",\"urlList\":$(cat "$F")}" \
              && echo "IndexNow pinged: $(cat "$F")" || echo "IndexNow ping failed (non-fatal)"
          else
            echo "No new URLs to ping."
          fi

      - name: Commit + deploy (no skip-ci, so Vercel rebuilds and the post goes live)
        run: |
          git config user.name "blog-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then echo "No changes (queue empty) — nothing to publish."; exit 0; fi
          git add apps/web/src/content/posts-batch-3.ts tools/blog-queue/queue.json
          git commit -m "Blog: auto-publish next queued post"
          # Rebase-and-retry: the GSC bot (and the owner) also push to main, and cron
          # drift can overlap the two. A plain push would be rejected and the day's
          # posts silently lost. Retry on top of the latest main so nothing is dropped.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $attempt."; exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing on latest origin/main and retrying."
            git pull --rebase origin main || { echo "Rebase failed."; exit 1; }
          done
          echo "ERROR: could not push after 5 attempts."; exit 1

      # A red X in the Actions tab reaches nobody. This is the only path to the
      # owner's inbox, and it matters most while they are away for weeks.
      - name: Tell the owner if publishing failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## ⚠️ The daily blog robot failed"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Most likely causes: the queue is empty or a queued post failed validation,"
            echo "or the push could not be rebased onto main."
            echo ""
            echo "No post was published today. The site is unaffected — it just did not update."
            echo ""
            echo "cc @irabailtariq-beep"
          } > /tmp/blogfail.md
          TITLE="Blog robot failed"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh issue create --title "⚠️ $TITLE" --body-file /tmp/blogfail.md
          else
            gh issue comment "$NUM" --body-file /tmp/blogfail.md
          fi
