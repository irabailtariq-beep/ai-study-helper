name: Site health check

# Every 6 hours, prove the site AND the AI still actually work.
# Without this, an expired/quota-exhausted GEMINI_API_KEY would turn all ten
# tools into 500s while the blog and Search Console robots both stayed green and
# nobody was told. This is the only alarm that fires when the product is broken.

on:
  schedule:
    - cron: "15 */6 * * *"   # 00:15, 06:15, 12:15, 18:15 UTC
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check key pages respond
        id: pages
        run: |
          FAIL=""
          for p in "" "/tools" "/blog" "/explain" "/math-solver" "/sitemap.xml" "/feed.xml"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://helpinstudy.com$p" || echo "000")
            echo "  $p -> $CODE"
            case "$CODE" in 200) ;; *) FAIL="$FAIL $p($CODE)";; esac
          done
          if [ -n "$FAIL" ]; then
            echo "pages_fail=$FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the AI actually answers
        id: ai
        run: |
          # A real end-to-end call: if the Gemini key is dead, out of quota, or the
          # model was retired, this is what catches it.
          BODY='{"profile":{"country":"GB","age":16,"grade":"Year 11","curriculum":"uk-gcse-aqa","guest":true},"text":"What is photosynthesis? One sentence."}'
          RESP=$(curl -s --max-time 90 -X POST "https://helpinstudy.com/api/explain" \
            -H "content-type: application/json" -d "$BODY" || echo '{}')
          echo "$RESP" | head -c 400
          # Expect a non-empty explanation field
          OK=$(printf '%s' "$RESP" | python3 -c "import sys,json;
try:
    d=json.load(sys.stdin)
    t=(d.get('explanation') or d.get('summary') or '')
    print('yes' if isinstance(t,str) and len(t.strip())>40 else 'no')
except Exception:
    print('no')" 2>/dev/null || echo "no")
          if [ "$OK" != "yes" ]; then
            echo "ai_fail=1" >> "$GITHUB_OUTPUT"
            printf '%s' "$RESP" | head -c 500 > /tmp/ai-resp.txt
          fi

      - name: Report a failure (GitHub issue -> your inbox)
        if: steps.pages.outputs.pages_fail != '' || steps.ai.outputs.ai_fail != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 🚨 helpinstudy.com health check failed"
            echo ""
            echo "Checked at $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo ""
            if [ -n "${{ steps.pages.outputs.pages_fail }}" ]; then
              echo "**Pages not returning 200:** ${{ steps.pages.outputs.pages_fail }}"
              echo ""
            fi
            if [ -n "${{ steps.ai.outputs.ai_fail }}" ]; then
              echo "**The AI did not answer.** /api/explain returned no usable explanation."
              echo "Most likely: GEMINI_API_KEY expired, free-tier quota exhausted, or the model was retired."
              echo ""
              echo '```'
              cat /tmp/ai-resp.txt 2>/dev/null | head -c 500
              echo ""
              echo '```'
              echo ""
              echo "Fix: check the key in Vercel → Project → Settings → Environment Variables, then redeploy."
            fi
            echo ""
            echo "cc @irabailtariq-beep"
          } > /tmp/health.md

          TITLE="Site health check failed"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh issue create --title "🚨 $TITLE" --body-file /tmp/health.md
          else
            gh issue comment "$NUM" --body-file /tmp/health.md
          fi
          exit 1

      - name: Close the alert if everything is healthy again
        if: steps.pages.outputs.pages_fail == '' && steps.ai.outputs.ai_fail == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Site health check failed"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ Recovered — pages and the AI are responding normally again."
            gh issue close "$NUM"
          fi
          echo "All healthy."
