name: Site health check

# Every 6 hours, prove the site AND the AI still actually work.
# Without this, an expired or quota-exhausted GEMINI_API_KEY would turn all ten
# tools into 500s while the blog and Search Console robots both stayed green and
# nobody was told. This is the only alarm that fires when the product is broken.
#
# NOTE: keep every line of a `run:` block indented. An earlier version embedded
# multi-line Python whose `try:` sat at column 0, which terminated the YAML block
# scalar and made this whole workflow invalid — so GitHub never scheduled it and
# the site went unmonitored. Validate with a real YAML parser before pushing.

on:
  schedule:
    - cron: "15 */6 * * *"   # 00:15, 06:15, 12:15, 18:15 UTC
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check key pages respond
        id: pages
        run: |
          FAIL=""
          for p in "" "/tools" "/blog" "/explain" "/math-solver" "/sitemap.xml" "/feed.xml"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://helpinstudy.com$p" || echo "000")
            echo "  $p -> $CODE"
            if [ "$CODE" != "200" ]; then FAIL="$FAIL $p($CODE)"; fi
          done
          if [ -n "$FAIL" ]; then echo "pages_fail=$FAIL" >> "$GITHUB_OUTPUT"; fi

      # The catastrophic-and-silent failure: one bad edit to a shared layout can
      # hide the whole site from Google, and nothing else here would notice —
      # pages still return 200, the sitemap still lists them, and the tools still
      # answer. It would take weeks to spot by watching traffic that is already
      # near zero. These three assertions close that hole.
      - name: Check nothing is accidentally hidden from Google
        id: seo
        run: |
          FAIL=""

          ROBOTS=$(curl -s --max-time 30 "https://helpinstudy.com/robots.txt" || echo "")
          if [ -z "$ROBOTS" ]; then
            FAIL="$FAIL robots.txt(empty)"
          elif printf '%s' "$ROBOTS" | grep -qE '^[[:space:]]*Disallow:[[:space:]]*/[[:space:]]*$'; then
            FAIL="$FAIL robots.txt(DISALLOW-ALL)"
          fi

          for p in "" "/tools" "/explain" "/blog" "/gcse/gcse-grade-calculator" "/help-in-study/math"; do
            HTML=$(curl -s --max-time 30 "https://helpinstudy.com$p" || echo "")
            HDRS=$(curl -s -I --max-time 30 "https://helpinstudy.com$p" || echo "")
            LABEL="${p:-/}"

            # noindex in the page or in an X-Robots-Tag header
            if printf '%s' "$HTML" | grep -qi 'name="robots"[^>]*noindex'; then FAIL="$FAIL $LABEL(noindex-meta)"; fi
            if printf '%s' "$HDRS" | grep -qi '^x-robots-tag:.*noindex'; then FAIL="$FAIL $LABEL(noindex-header)"; fi

            # a canonical must exist and must point at helpinstudy.com — a canonical
            # aimed at another domain silently hands the page away
            CANON=$(printf '%s' "$HTML" | grep -oE '<link rel="canonical" href="[^"]*"' | head -1 | sed 's/.*href="//; s/"$//')
            if [ -z "$CANON" ]; then FAIL="$FAIL $LABEL(no-canonical)"; fi
            case "$CANON" in
              ""|https://helpinstudy.com*) ;;
              *) FAIL="$FAIL $LABEL(canonical->$CANON)" ;;
            esac
          done

          if [ -n "$FAIL" ]; then
            echo "seo_fail=$FAIL" >> "$GITHUB_OUTPUT"
            echo "PROBLEMS:$FAIL"
          else
            echo "  all pages indexable, canonicals correct, robots.txt sane"
          fi

      # Canary: exercise the AI endpoints a student actually uses. At two
      # visitors a week nobody will ever report that a tool broke, so this is
      # the only thing that will ever tell us. Each probe asserts on a field the
      # real UI needs, not just HTTP 200 — a route can return 200 with an error
      # body. Requests carry a marker so these hits are recognisable as our own.
      - name: Check the AI tools actually work
        id: ai
        run: |
          PROFILE='{"country":"GB","age":16,"grade":"Year 11","curriculum":"uk-gcse-aqa","guest":true}'
          FAIL=""
          : > /tmp/ai-resp.txt

          probe () {           # probe <name> <path> <json-body> <required-field>
            NAME="$1"; PATHX="$2"; BODY="$3"; FIELD="$4"
            RESP=$(curl -s --max-time 90 -X POST "https://helpinstudy.com$PATHX" \
              -H "content-type: application/json" \
              -H "user-agent: helpinstudy-canary (health check)" \
              -d "$BODY" || echo '{}')
            OK=$(FIELD="$FIELD" printf '%s' "$RESP" | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                let ok='no';
                try{
                  const j=JSON.parse(s);
                  const v=process.env.FIELD.split('.').reduce((a,k)=>a==null?a:a[k], j);
                  const len = Array.isArray(v) ? v.length : String(v ?? '').trim().length;
                  ok = len > (Array.isArray(v) ? 0 : 20) ? 'yes' : 'no';
                }catch(e){}
                process.stdout.write(ok);
              })")
            echo "  $NAME -> $OK"
            if [ "$OK" != "yes" ]; then
              FAIL="$FAIL $NAME"
              { echo "--- $NAME ($PATHX) ---"; printf '%s' "$RESP" | head -c 220; echo ""; } >> /tmp/ai-resp.txt
            fi
          }

          probe "explain"     "/api/explain"     "{\"profile\":$PROFILE,\"text\":\"What is photosynthesis? One sentence.\"}"                       "explanation"
          probe "math-solver" "/api/math"        "{\"profile\":$PROFILE,\"action\":\"solve\",\"text\":\"Solve 3x + 7 = 22\"}"                                            "steps"
          probe "quiz"        "/api/quiz"        "{\"profile\":$PROFILE,\"sourceText\":\"Photosynthesis converts light energy into glucose in chloroplasts.\",\"count\":2}" "items"
          probe "grade"       "/api/grade"       "{\"profile\":$PROFILE,\"question\":\"Describe photosynthesis (2 marks)\",\"studentAnswer\":\"Plants use light to make glucose from carbon dioxide and water.\",\"marks\":2}" "feedback"
          probe "chat"        "/api/chat"        "{\"profile\":$PROFILE,\"history\":[{\"role\":\"user\",\"content\":\"Explain osmosis in one sentence.\"}]}" "reply"

          if [ -n "$FAIL" ]; then
            echo "ai_fail=1" >> "$GITHUB_OUTPUT"
            echo "ai_broken=$FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a failure (GitHub issue so it reaches your inbox)
        if: steps.pages.outputs.pages_fail != '' || steps.ai.outputs.ai_fail != '' || steps.seo.outputs.seo_fail != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout step in this job, so gh has no local repo context —
          # without GH_REPO every gh call dies with "could not determine base
          # repo", which both silenced real alerts and failed healthy runs.
          GH_REPO: ${{ github.repository }}
          PAGES_FAIL: ${{ steps.pages.outputs.pages_fail }}
          SEO_FAIL: ${{ steps.seo.outputs.seo_fail }}
          AI_FAIL: ${{ steps.ai.outputs.ai_fail }}
          AI_BROKEN: ${{ steps.ai.outputs.ai_broken }}
        run: |
          {
            echo "## helpinstudy.com health check failed"
            echo ""
            echo "Checked at $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo ""
            if [ -n "$PAGES_FAIL" ]; then
              echo "**Pages not returning 200:**$PAGES_FAIL"
              echo ""
            fi
            if [ -n "$SEO_FAIL" ]; then
              echo "**URGENT — the site may be hidden from Google:**$SEO_FAIL"
              echo ""
              echo "A page is telling Google not to index it, or points its canonical somewhere else, or robots.txt is blocking everything. This removes pages from search with no other visible symptom. Check the most recent deploy."
              echo ""
            fi
            if [ -n "$AI_FAIL" ]; then
              echo "**These AI tools failed:**$AI_BROKEN"
              echo "Most likely: GEMINI_API_KEY expired, free-tier quota exhausted, or the model was retired."
              echo ""
              echo "Response head:"
              echo ""
              sed 's/^/    /' /tmp/ai-resp.txt 2>/dev/null || true
              echo ""
              echo "Fix: check the key in Vercel, Project, Settings, Environment Variables, then redeploy."
            fi
            echo ""
            echo "cc @irabailtariq-beep"
          } > /tmp/health.md
          TITLE="Site health check failed"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --body-file /tmp/health.md
          else
            gh issue comment "$NUM" --body-file /tmp/health.md
          fi
          exit 1

      - name: Close the alert if everything is healthy again
        if: steps.pages.outputs.pages_fail == '' && steps.ai.outputs.ai_fail == '' && steps.seo.outputs.seo_fail == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Site health check failed"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Recovered - pages and the AI are responding normally again."
            gh issue close "$NUM"
          fi
          echo "All healthy."
