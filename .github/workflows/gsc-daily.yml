name: Daily Search Console check

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 2:00 PM Pakistan (PKT). Cron can drift ~5-30 min.
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

permissions:
  contents: write          # commit the updated snapshot back
  issues: write            # post the daily verdict as an issue comment (emails you)

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install deps
        working-directory: tools/gsc
        run: npm install --no-audit --no-fund

      - name: Pull Search Console
        working-directory: tools/gsc
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: node gsc-daily.mjs

      - name: Email the daily verdict (GitHub issue -> your inbox)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Daily Search Console report"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh issue create --title "📊 $TITLE" --body-file tools/gsc/summary.md
          else
            gh issue comment "$NUM" --body-file tools/gsc/summary.md
          fi

      - name: Commit snapshot
        run: |
          git config user.name "gsc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/gsc/history.json
          git commit -m "chore: daily Search Console snapshot [skip ci]" || echo "no changes to commit"
          git push
