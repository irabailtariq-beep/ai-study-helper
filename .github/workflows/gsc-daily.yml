name: Daily Search Console check

on:
  schedule:
    - cron: "13 9 * * *"  # 09:13 UTC = 2:13 PM Pakistan. Off-peak minute: GitHub skips congested :00/:30 slots (it skipped us twice).
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

permissions:
  contents: write          # commit the updated snapshot back
  issues: write            # post the daily verdict as an issue comment (emails you)

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install deps
        working-directory: tools/gsc
        # npm ci against the committed lockfile: `npm install` with a ^ range
        # re-resolved googleapis every day, so one bad release could break the
        # only channel that emails the owner.
        run: npm ci --no-audit --no-fund

      # Sweep first: the dashboard's funnel and its "today's 10" worklist both
      # read index-state.json, so this has to produce it before the render.
      # Non-fatal on purpose — a Search Console blip should still leave us with
      # the search-performance half of the dashboard rather than no dashboard.
      - name: Sweep index status of every page
        working-directory: tools/gsc
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: node index-sweep.mjs || echo "index sweep failed — dashboard will render without the funnel"

      - name: Pull Search Console
        working-directory: tools/gsc
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: node gsc-daily.mjs

      - name: Email the daily verdict (GitHub issue -> your inbox)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Daily Search Console report"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh issue create --title "📊 $TITLE" --body-file tools/gsc/summary.md
          else
            gh issue comment "$NUM" --body-file tools/gsc/summary.md
          fi

      - name: Commit snapshot
        run: |
          git config user.name "gsc-bot"
          git config user.email "actions@users.noreply.github.com"
          # dashboard.html is regenerated every run; the copy under
          # apps/web/public is what serves helpinstudy.com/dashboard.html
          git add tools/gsc/history.json tools/gsc/dashboard.html tools/gsc/index-state.json apps/web/public/dashboard.html
          if git diff --cached --quiet; then echo "no changes to commit"; exit 0; fi
          git commit -m "chore: daily Search Console snapshot + dashboard"
          # Rebase-and-retry so a concurrent blog-bot / owner push can't drop this snapshot.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $attempt."; exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing on latest origin/main and retrying."
            git pull --rebase origin main || { echo "Rebase failed."; exit 1; }
          done
          echo "ERROR: could not push after 5 attempts."; exit 1

      # Without this, a broken Search Console robot is silent: the report just
      # stops arriving and nothing says why. The blog robot has had this since
      # August; this one never did.
      - name: Tell the owner if the Search Console robot failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## ⚠️ The Search Console robot failed"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Most likely: the GSC_SA_JSON service-account key expired or was rotated,"
            echo "or Search Console was briefly unreachable."
            echo ""
            echo "What it means for you: no daily numbers today, and helpinstudy.com/dashboard.html"
            echo "is still showing the last successful run rather than today."
            echo ""
            echo "cc @irabailtariq-beep"
          } > /tmp/gscfail.md
          TITLE="Search Console robot failed"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh issue create --title "⚠️ $TITLE" --body-file /tmp/gscfail.md
          else
            gh issue comment "$NUM" --body-file /tmp/gscfail.md
          fi
